services:
  limesurvey:
    build:
      context: 7.0/apache/
      dockerfile: Dockerfile
    volumes:
      # TODO Update storage location as desired. All subdirectories of the `upload` may contain
      # data intended to be persistent (e.g. themes). `upload` host directory must already have the
      # base content from LimeSurvey on https://community.limesurvey.org/downloads/
      - ./lime-data/upload:/var/www/html/upload
    networks:
      - limesurvey-db
    ports:
      - 7181:8080
    depends_on:
      - db
  db:
    image: docker.io/postgres:10-alpine
    restart: always
    volumes:
      - ./data/db-data:/var/lib/postgresql/data
    environment:
      - "DB_HOST=lime-db"
      # TODO set passwords
      # - "DB_PASSWORD="
      # - "ADMIN_PASSWORD="
      # If you require an empty table prefix, use a space as the DB_TABLE_PREFIX
      # - "DB_TABLE_PREFIX= "
  lime-db:
    image: mariadb:11.4
    networks:
      - limesurvey-db
    environment:
      - "MYSQL_USER=limesurvey"
      - "MYSQL_DATABASE=limesurvey"
      # TODO set passwords
      # - "MYSQL_PASSWORD="
      # - "MYSQL_ROOT_PASSWORD="

networks:
  limesurvey-db:
    driver: bridge
